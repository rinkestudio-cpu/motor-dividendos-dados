name: Atualizar dados da B3
on:
  schedule:
    - cron: "10 13,16,19,22 * * 1-5"   # 10:10, 13:10, 16:10 e 19:10 (horário de Brasília), dias úteis
  workflow_dispatch:
permissions:
  contents: write
concurrency: coletor
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python coletor.py
      - name: Salvar dados
        run: |
          git config user.name "motor-dividendos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Dados atualizados $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          git push
